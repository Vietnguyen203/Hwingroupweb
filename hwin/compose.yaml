# Hạ tầng dev: PostgreSQL + Redis.
# Dùng cổng 15432 / 16379 để tránh trùng với Postgres/Redis đã cài sẵn trên máy.
services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=hwin'
      - 'POSTGRES_USER=hwin'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-hwin_dev}'
    ports:
      - '15432:5432'
    volumes:
      - 'hwin-pg:/var/lib/postgresql/data'
  redis:
    image: 'redis:7-alpine'
    ports:
      - '16379:6379'

volumes:
  hwin-pg:
