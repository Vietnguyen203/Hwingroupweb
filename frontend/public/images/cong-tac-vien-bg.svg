<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 680" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mạng lưới cộng tác viên kết nối với HWIN">
  <!-- Hình nền "hợp tác" cho banner Cộng tác viên: mạng lưới người kết nối quanh một trung tâm. Màu theo bảng màu thương hiệu.
       Muốn dùng ảnh thật: thay file này bằng ảnh cùng tên (hoặc đổi đường dẫn ở sticky-side-banners.tsx). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6c3bff"/>
      <stop offset="0.55" stop-color="#4a26c4"/>
      <stop offset="1" stop-color="#1f1450"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.8" cy="0.04" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowHub" cx="0.5" cy="0.485" r="0.5">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <!-- Một người: đầu + vai -->
    <g id="person">
      <circle r="19" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.3"/>
      <circle cy="-5" r="6" fill="#fff" fill-opacity="0.5"/>
      <path d="M-11 12C-11 4 -6 2 0 2C6 2 11 4 11 12Z" fill="#fff" fill-opacity="0.5"/>
    </g>
    <g id="personAccent">
      <circle r="19" fill="#ff6b35" fill-opacity="0.22" stroke="#ff6b35" stroke-opacity="0.7"/>
      <circle cy="-5" r="6" fill="#ff9a6b" fill-opacity="0.9"/>
      <path d="M-11 12C-11 4 -6 2 0 2C6 2 11 4 11 12Z" fill="#ff9a6b" fill-opacity="0.9"/>
    </g>
  </defs>

  <rect width="260" height="680" fill="url(#bg)"/>
  <rect width="260" height="680" fill="url(#glowTop)"/>
  <rect width="260" height="680" fill="url(#glowHub)"/>

  <!-- Vòng tròn đồng tâm quanh trung tâm -->
  <g fill="none" stroke="#fff" stroke-opacity="0.1">
    <circle cx="130" cy="330" r="62"/>
    <circle cx="130" cy="330" r="118"/>
    <circle cx="130" cy="330" r="176"/>
    <circle cx="130" cy="330" r="238"/>
  </g>

  <!-- Đường nối từng người về trung tâm -->
  <g stroke="#fff" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="3 6" stroke-linecap="round">
    <line x1="130" y1="330" x2="40" y2="72"/>
    <line x1="130" y1="330" x2="222" y2="58"/>
    <line x1="130" y1="330" x2="64" y2="196"/>
    <line x1="130" y1="330" x2="204" y2="182"/>
    <line x1="130" y1="330" x2="26" y2="430"/>
    <line x1="130" y1="330" x2="236" y2="446"/>
    <line x1="130" y1="330" x2="48" y2="560"/>
    <line x1="130" y1="330" x2="216" y2="548"/>
    <line x1="130" y1="330" x2="98" y2="632"/>
    <line x1="130" y1="330" x2="180" y2="620"/>
  </g>

  <!-- Trung tâm (HWIN) -->
  <circle cx="130" cy="330" r="30" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.35"/>
  <circle cx="130" cy="330" r="14" fill="#ff6b35" fill-opacity="0.55"/>

  <!-- Các cộng tác viên -->
  <use href="#person" x="40" y="72"/>
  <use href="#person" x="222" y="58"/>
  <use href="#personAccent" x="64" y="196"/>
  <use href="#person" x="204" y="182"/>
  <use href="#person" x="26" y="430"/>
  <use href="#person" x="236" y="446"/>
  <use href="#person" x="48" y="560"/>
  <use href="#personAccent" x="216" y="548"/>
  <use href="#person" x="98" y="632"/>
  <use href="#person" x="180" y="620"/>

  <!-- Đốm sáng trang trí -->
  <g fill="#fff" fill-opacity="0.4">
    <circle cx="150" cy="120" r="2"/>
    <circle cx="24" cy="260" r="1.6"/>
    <circle cx="238" cy="330" r="2"/>
    <circle cx="150" cy="500" r="1.8"/>
    <circle cx="20" cy="640" r="1.6"/>
    <circle cx="240" cy="640" r="2"/>
  </g>
</svg>
