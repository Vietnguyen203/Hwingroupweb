# Cấu hình cho test (Testcontainers cung cấp Postgres/Redis). Giá trị chỉ dùng cho test.
spring:
  mail:
    host: ""         # test KHÔNG gửi email thật (bỏ qua MAIL_HOST trong .env của máy dev) – mã lấy từ hộp thư dev
hwin:
  identity:
    pii-encryption-key: dGVzdC1vbmx5LXBpaS1rZXktMzItYnl0ZXMtLS0tLSE=
  admin-seed:          # test không tạo admin seed (bỏ qua giá trị trong .env của máy dev)
    email: ""
    password: ""
  security:
    jwt-secret: test-only-secret-0123456789abcdef-0123456789
    cookie-secure: false
  otp:
    pepper: test-only-pepper
    log-code: true
  ordering:
    simulated-time-enabled: true
  affiliate:
    bank-encryption-key: dGVzdC1vbmx5LWFlcy1nY20ta2V5LTMyLWJ5dGVzISE=
    simulated-time-enabled: true
  storage:
    local-dir: build/test-uploads
