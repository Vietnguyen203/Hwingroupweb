# Profile dev: bật Swagger, in OTP ra log, cookie không bắt buộc HTTPS.
spring:
  flyway:
    # dev: nạp thêm dữ liệu mẫu (1 CTV đã duyệt + đơn hàng mẫu) – xem db/demo/V9_0_0__demo_data.sql
    locations: classpath:db/migration,classpath:db/demo
    # Dữ liệu mẫu dùng version 9.x -> migration thật thêm sau (version nhỏ hơn) vẫn được chạy
    out-of-order: true
  datasource:
    password: ${DB_PASSWORD:hwin_dev}
  mail:                          # dev: Mailpit (compose.yaml) – xem thư tại http://localhost:18025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:11025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}            # Gmail / SMTP thật: đặt true trong .env
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

hwin:
  admin-seed:                    # dev: tài khoản admin/admin MIỄN OTP (chỉ tồn tại ở dev)
    email: ${ADMIN_EMAIL:admin}
    password: ${ADMIN_PASSWORD:admin}
    otp-exempt: true
  security:
    cookie-secure: ${COOKIE_SECURE:false}
  otp:
    log-code: true
    ip-send-limit: 50          # dev: nới giới hạn theo IP để chạy Postman nhiều lần
  ordering:
    place-order-limit: 30          # dev: nới giới hạn đặt hàng để chạy Postman (thật: 5 đơn / 10 phút)
    simulated-time-enabled: true   # dev: admin chạy job hủy đơn quá hạn với thời điểm giả lập
  affiliate:
    simulated-time-enabled: true   # dev: admin chạy job duyệt hoa hồng với thời điểm giả lập

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.vietnl.hwin: DEBUG
