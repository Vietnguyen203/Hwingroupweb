spring:
  application:
    name: hwin
  profiles:
    default: dev
  config:
    # Bí mật lấy từ biến môi trường hoặc file .env (không commit). Xem .env.example
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/hwin}
    username: ${DB_USERNAME:hwin}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # Dữ liệu mẫu (db/demo) chỉ nạp ở dev -> môi trường khác bỏ qua migration "missing" thay vì báo lỗi
    ignore-migration-patterns: "*:missing"
  mail:                          # SMTP gửi OTP qua email – MAIL_HOST trống: chỉ dev/test được phép (xem EmailOtpSender)
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  docker:
    compose:
      lifecycle-management: start-only
  modulith:
    events:
      republish-outstanding-events-on-restart: true
  web:
    error:
      include-stacktrace: never
  jackson:
    deserialization:
      # Jackson 3 mặc định lỗi khi JSON thiếu field boolean/int -> cho nhận giá trị mặc định
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8088}
  error:
    include-stacktrace: never

management:
  health:
    mail:
      enabled: false   # SMTP chậm / lỗi không làm health DOWN; lỗi được báo khi gửi OTP
  endpoints:
    web:
      exposure:
        include: health,modulith

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

hwin:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: ${COOKIE_SECURE:true}
    cors-origins: ${FRONTEND_ORIGIN:http://localhost:3100}
  mail:
    from: ${MAIL_FROM:Hwin Food <no-reply@hwin.vn>}
  identity:
    pii-encryption-key: ${IDENTITY_PII_KEY}   # AES 32 byte base64 – mã hóa CCCD
    trusted-device-ttl: 30d                  # "Ghi nhớ đăng nhập": không hỏi OTP lại trong 30 ngày
    login-fail-limit: 5
    login-fail-window: 15m
  otp:
    ttl: 5m
    max-attempts: 5
    lock-duration: 15m
    send-limit: 3                # theo nơi nhận (SĐT / email)
    ip-send-limit: 3
    send-window: 10m
    pepper: ${OTP_PEPPER}
    log-code: false
  admin-seed:                    # admin đầu tiên – môi trường thật: mật khẩu mạnh + nơi nhận OTP (email thật hoặc SĐT)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    phone: ${ADMIN_PHONE:}
    full-name: Quản trị viên
    otp-exempt: false            # true chỉ được phép ở profile dev
  storage:
    local-dir: ${STORAGE_DIR:./uploads}
    public-path: /uploads/
    # Kho riêng tư (ảnh CCCD): không phục vụ công khai, chỉ đọc qua API có phân quyền
    private-dir: ${PRIVATE_STORAGE_DIR:./private-uploads}
  ordering:
    shipping-fee: 30000
    return-window-days: 7
    place-order-limit: 5          # số đơn tối đa / 10 phút / user
    bank-qr-payment-timeout-hours: 24   # đơn chuyển khoản chưa nhận tiền quá hạn -> tự hủy
    simulated-time-enabled: false
    bank-qr:                      # tài khoản nhận chuyển khoản (sinh ảnh VietQR)
      bank-bin: ${BANK_QR_BIN:970436}
      account-no: ${BANK_QR_ACCOUNT:0123456789}
      account-name: ${BANK_QR_NAME:CONG TY HWIN}
  customer:
    loyal-min-orders: 3
    dormant-days: 60
  affiliate:
    commission-rate: 0.10
    hold-days: 7
    min-payout: 200000
    ref-cookie-days: 30
    click-dedupe-hours: 24
    bank-change-lock-hours: 48
    bank-encryption-key: ${AFFILIATE_BANK_KEY}
    share-base-url: ${FRONTEND_ORIGIN:http://localhost:3100}
    simulated-time-enabled: false
