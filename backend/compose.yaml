# Hạ tầng dev: PostgreSQL + Redis + Mailpit (hộp thư giả nhận email OTP).
# Dùng cổng 15432 / 16379 để tránh trùng với Postgres/Redis đã cài sẵn trên máy.
# Giữ tên project cố định (không phụ thuộc tên thư mục) để dùng lại container + volume dữ liệu.
name: hwin

services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=hwin'
      - 'POSTGRES_USER=hwin'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-hwin_dev}'
    ports:
      - '15432:5432'
    volumes:
      - 'hwin-pg:/var/lib/postgresql/data'
  redis:
    image: 'redis:7-alpine'
    ports:
      - '16379:6379'
  mailpit:
    # SMTP 11025, giao diện xem thư http://localhost:18025
    image: 'axllent/mailpit:latest'
    ports:
      - '11025:1025'
      - '18025:8025'

volumes:
  hwin-pg:
